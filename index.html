<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>SIEE 3017</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family:Arial,sans-serif; background:#f4f1f7; color:#333; }
header { background:#6b3fa0; color:white; text-align:center; padding:22px 15px; }
header h1 { margin:0; font-size:25px; }
header h2 { margin:8px 0 0; font-size:15px; font-weight:normal; }
.contenedor { max-width:1200px; margin:25px auto; padding:0 15px; }
.buscador { background:white; padding:25px; border-radius:15px; box-shadow:0 3px 12px rgba(0,0,0,.10); text-align:center; }
.buscador h3 { margin-top:0; color:#6b3fa0; font-size:24px; }
.buscador p { font-size:18px; }
input { width:100%; max-width:420px; padding:15px; border:2px solid #6b3fa0; border-radius:10px; font-size:18px; text-align:center; }
button { margin-top:15px; padding:14px 30px; border:none; border-radius:10px; background:#6b3fa0; color:white; font-size:17px; font-weight:bold; cursor:pointer; }
button:active { transform:scale(.97); }
#mensaje { margin-top:18px; min-height:22px; font-weight:bold; }
.cargando { color:#6b3fa0; } .error { color:#c00000; } .exito { color:#38761d; }
.datos-alumno { display:none; margin-top:25px; }
.tarjetas { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:20px; }
.tarjeta { background:white; border-radius:14px; padding:18px; text-align:center; box-shadow:0 3px 10px rgba(0,0,0,.08); }
.tarjeta .titulo { font-size:13px; color:#777; }
.tarjeta .valor { font-size:23px; font-weight:bold; margin-top:8px; color:#6b3fa0; }
.tabla-contenedor { background:white; border-radius:14px; padding:15px; overflow-x:auto; box-shadow:0 3px 12px rgba(0,0,0,.10); }
.tabla-contenedor h3 { color:#6b3fa0; }
table { border-collapse:collapse; width:100%; min-width:1400px; }
th { background:#6b3fa0; color:white; padding:9px; border:1px solid #ddd; white-space:nowrap; }
td { padding:8px; border:1px solid #ddd; text-align:center; white-space:nowrap; }
.verde { background:#b6d7a8; font-weight:bold; } .amarillo { background:#ffe599; font-weight:bold; } .rojo { background:#ea9999; font-weight:bold; } .gris { background:#eeeeee; }
footer { text-align:center; padding:30px 15px; color:#777; font-size:13px; }
@media(max-width:600px) { header h1{font-size:22px} header h2{font-size:13px} .buscador{padding:20px 15px} .buscador h3{font-size:21px} .tarjetas{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<header>
<h1>🐺 SIEE 3017</h1>
<h2>Escuela Secundaria Estatal "Gral. Francisco Villa" No. 3017</h2>
<h2>Sistema Integral de Evaluación y Economía Escolar (SIEE)</h2>
</header>

<div class="contenedor">
<div class="buscador">
<h3>Consulta de alumno</h3>
<p>Ingresa el ID de tu hijo(a)</p>
<input type="text" id="idAlumno" placeholder="Ejemplo: A-001" autocomplete="off">
<br>
<button type="button" id="botonConsultar">CONSULTAR</button>
<div id="mensaje"></div>
</div>

<div id="datosAlumno" class="datos-alumno">
<div class="tarjetas">
<div class="tarjeta"><div class="titulo">ALUMNO</div><div class="valor" id="nombreAlumno">---</div></div>
<div class="tarjeta"><div class="titulo">PROMEDIO FINAL</div><div class="valor" id="promedioFinal">---</div></div>
<div class="tarjeta"><div class="titulo">MATEPESOS</div><div class="valor" id="matepesos">---</div></div>
<div class="tarjeta"><div class="titulo">ESTADO</div><div class="valor" id="estadoAlumno">---</div></div>
</div>

<div class="tabla-contenedor">
<h3>📊 Desempeño académico</h3>
<table>
<thead><tr id="encabezados"></tr></thead>
<tbody><tr id="filaAlumno"></tr></tbody>
</table>
</div>
</div>
</div>

<footer>Profesora Myrna Judith Limas Gómez</footer>

<script>
/* =====================================================
ARCHIVOS PÚBLICOS: A-001 A A-030
Cada ID apunta al archivo individual que ya creaste.
===================================================== */
const ARCHIVOS = {
  "A-001": "19Ti5RrFpqROK7F0pz6U76oOp-ny1oocHQH0pk_M5YAg",
  "A-002": "1Ef8SGinOgC770i4tdEWLbv2xHvLBfyavdXZRNd0kR-0",

  "A-007": "1lrHv6I6yGvRhgYHrAd6qWUfBdhDVunQo0xhyWlG448U",
  "A-008": "1IZdizDioQmxEzRIiOBZju3fKVxAoA_97rGwDg_FNxAw",
  "A-009": "1sY3oOsfN5dmU9q5OwV1MhCRynOsQT6VvLdNlSAA2TSw",
  "A-010": "1yYHTQZWn-yPrX_74WH2Ptilf9LQPXQZY6mleXlZpGUI",
  "A-011": "1x6pCprtgoSM9qr0-UTxHmDiRbk2CkVSeJHYvf8ZnBZk",

  "A-013": "1llIYimCX_6-6Ms3WgkQ49lH5LTMzTYy1Lq5mmQ1DsvA",
  "A-014": "1DqMZz0yLF6gsjM6YCmfvIfRm-MnXaZmK8UuJPn3RWlU",
  "A-015": "1SWbAqRqCe5aKhW3_u_9BdgWnacMqjkRwYDYNKcwpiNw",
  "A-016": "1CjHt8Vc6u-BJpZuy9EKtAEc4jXZ94tW7JuuaPq2k6oE",
  "A-017": "1EIScDYIDov1WRMn0N13X0FAl8lL3Oe08SrM9Gd92fAo",
  "A-018": "15SOcStY38xCWK-WweiFH8XTnvB3Mx9pV72bWZi1Fqa4",
  "A-019": "1iQHyjjPupo3w_YVAoL2w96O9RtjPEgmrYHnF4_rjBjY",
  "A-020": "1s38RRdRsXmOt92G4FqAAenJWGRYAgiC6HLqfW8v7Rco",
  "A-021": "1YHq24bLJ8_lVlfX5Qz4HnsCgghSQU06OPQE8ytlIG0M",
  "A-022": "13WrSMkOO8dAnHqFf87LPGule-FTFxvEXGIRjU34ltM4",
  "A-023": "16StIZyigLhYZeUseRbEHcQMDOEWE4FsZkF-x6Vq64bY",
  "A-024": "1iDEjHadyvV5GsCOYvBg7NGwE8gVC6wGPgDMCsPD5_xY",
  "A-025": "1o3EBNpOW8jHBWs1bKvxe0wxKb6V9OlBjEwmKk56qv_k",
  "A-026": "1ac9a6RCaKF3QbXhxv-UgRznJm8wobTSt9CgLbDNiLNI",
  "A-027": "1YhLMbyQgQy-Ca6B18ru6HciEiGgn5PQ_1BIqqdU4xgk",
  "A-028": "17TyJee9LQ6-GzG8aV-ZXUjTmW7Nc9WcMepWbqO0W5iw",
  "A-029": "1QC9-Pva_wQ8j2ATyOTVLf-BPHb6zfNLOfePPzzxu0cM",
  "A-030": "1T1f_Z8JQJ0pSqaJlyBYtQ_VMaAJtlqXJLIDAUnkB8b4"
};

const GID = "0";
const COLUMNA_ID = 0;
const COLUMNA_NOMBRE = 1;
const COLUMNA_PROMEDIO = 79;
const COLUMNA_MATEPESOS = 84;
const TOTAL_COLUMNAS = 85;

let contadorCallback = 0;
let datosGoogle = null;

function mostrarMensaje(texto, clase) {
  const mensaje = document.getElementById("mensaje");
  mensaje.textContent = texto;
  mensaje.className = clase || "";
}

function buscarAlumno() {
  const campo = document.getElementById("idAlumno");
  const id = campo.value.trim().toUpperCase();

  document.getElementById("datosAlumno").style.display = "none";

  if (!id) {
    mostrarMensaje("Escribe el ID del alumno.", "error");
    return;
  }

  if (!ARCHIVOS[id]) {
    mostrarMensaje("No se encontró el ID " + id + ".", "error");
    return;
  }

  mostrarMensaje("Consultando...", "cargando");

  const callback = "recibirAlumno_" + (++contadorCallback);

  window[callback] = function(respuesta) {
    try {
      if (!respuesta || !respuesta.table || !respuesta.table.rows) {
        mostrarMensaje("No se pudo recibir la información de Google.", "error");
        return;
      }

      datosGoogle = respuesta.table;

      const filas = datosGoogle.rows || [];
      if (!filas.length) {
        mostrarMensaje("El archivo de " + id + " no contiene datos.", "error");
        return;
      }

      // En cada archivo individual la fila 1 es encabezado y la fila 2 es el alumno.
      mostrarAlumno(datosGoogle.cols || [], filas[0], id);

    } catch (error) {
      console.error(error);
      mostrarMensaje("No se pudo mostrar la información del alumno.", "error");
    } finally {
      delete window[callback];
      const elemento = document.getElementById(callback);
      if (elemento) elemento.remove();
    }
  };

  const script = document.createElement("script");
  script.id = callback;

  const url =
    "https://docs.google.com/spreadsheets/d/" +
    ARCHIVOS[id] +
    "/gviz/tq" +
    "?gid=" + GID +
    "&headers=1" +
    "&tq=select%20*" +
    "&tqx=responseHandler%3A" + encodeURIComponent(callback);

  script.src = url;

  script.onerror = function() {
    mostrarMensaje(
      "No se pudo conectar con el archivo público de " + id + ".",
      "error"
    );
    delete window[callback];
    script.remove();
  };

  document.head.appendChild(script);
}

function mostrarAlumno(columnas, fila, id) {
  const encabezados = document.getElementById("encabezados");
  const filaAlumno = document.getElementById("filaAlumno");

  encabezados.innerHTML = "";
  filaAlumno.innerHTML = "";

  const nombre = obtenerTexto(fila[COLUMNA_NOMBRE]);
  const promedio = obtenerTexto(fila[COLUMNA_PROMEDIO]);
  const matepesos = obtenerTexto(fila[COLUMNA_MATEPESOS]);

  document.getElementById("nombreAlumno").textContent = nombre || "Alumno";
  document.getElementById("promedioFinal").textContent = promedio || "---";
  document.getElementById("matepesos").textContent = matepesos || "---";

  const numeroPromedio = parseFloat(String(promedio).replace(",", "."));
  const estado = document.getElementById("estadoAlumno");

  if (isNaN(numeroPromedio)) {
    estado.textContent = "---";
    estado.style.color = "#6b3fa0";
  } else if (numeroPromedio >= 8) {
    estado.textContent = "🟢 APROBADO";
    estado.style.color = "#38761d";
  } else if (numeroPromedio >= 6) {
    estado.textContent = "🟡 REGULAR";
    estado.style.color = "#bf9000";
  } else {
    estado.textContent = "🔴 EN RIESGO";
    estado.style.color = "#cc0000";
  }

  // El archivo individual tiene A = ID y B:CG = los encabezados/datos de la ficha.
  for (let i = 0; i < TOTAL_COLUMNAS; i++) {
    let encabezado = "";

    if (i === 0) {
      encabezado = "ID";
    } else {
      const columnaOriginal = columnas[i];
      encabezado = columnaOriginal && columnaOriginal.label
        ? columnaOriginal.label
        : obtenerLetraColumna(i);
    }

    const celda = fila[i] || null;
    const valor = obtenerValor(celda);
    const texto = obtenerTexto(celda);

    const th = document.createElement("th");
    th.textContent = encabezado;
    encabezados.appendChild(th);

    const td = document.createElement("td");
    td.textContent = i === 0 ? id : texto;
    aplicarSemaforo(td, i === 0 ? "" : valor);
    filaAlumno.appendChild(td);
  }

  document.getElementById("datosAlumno").style.display = "block";
  mostrarMensaje("Consulta realizada correctamente.", "exito");
}

function obtenerTexto(celda) {
  if (!celda) return "";
  if (celda.f !== undefined && celda.f !== null) return String(celda.f);
  if (celda.v !== undefined && celda.v !== null) return String(celda.v);
  return "";
}

function obtenerValor(celda) {
  if (!celda) return "";
  if (celda.v !== undefined && celda.v !== null) return celda.v;
  return "";
}

function obtenerLetraColumna(numero) {
  let resultado = "";
  let n = numero + 1;

  while (n > 0) {
    const residuo = (n - 1) % 26;
    resultado = String.fromCharCode(65 + residuo) + resultado;
    n = Math.floor((n - 1) / 26);
  }

  return resultado;
}

function aplicarSemaforo(celda, valor) {
  if (valor === "" || valor === null || valor === undefined) {
    celda.classList.add("gris");
    return;
  }

  const numero = parseFloat(String(valor).replace(",", "."));
  if (isNaN(numero)) return;

  if (numero >= 8) celda.classList.add("verde");
  else if (numero >= 6) celda.classList.add("amarillo");
  else celda.classList.add("rojo");
}

document.getElementById("botonConsultar")
  .addEventListener("click", buscarAlumno);

document.getElementById("idAlumno")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") buscarAlumno();
  });
</script>

</html>
