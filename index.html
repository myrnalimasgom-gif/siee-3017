<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f4f1f7; color: #333; }
header { background: #6b3fa0; color: white; text-align: center; padding: 22px 15px; }
header h1 { margin: 0; font-size: 25px; }
header h2 { margin: 8px 0 0; font-size: 15px; font-weight: normal; }
.contenedor { max-width: 1200px; margin: 25px auto; padding: 0 15px; }
.buscador { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 3px 12px rgba(0,0,0,.10); text-align: center; }
.buscador h3 { margin-top: 0; color: #6b3fa0; font-size: 24px; }
.buscador p { font-size: 18px; }
input { width: 100%; max-width: 420px; padding: 15px; border: 2px solid #6b3fa0; border-radius: 10px; font-size: 18px; text-align: center; }
button { margin-top: 15px; padding: 14px 30px; border: none; border-radius: 10px; background: #6b3fa0; color: white; font-size: 17px; font-weight: bold; cursor: pointer; }
button:active { transform: scale(.97); }
#mensaje { margin-top: 18px; min-height: 22px; font-weight: bold; }
.cargando { color: #6b3fa0; } .error { color: #c00000; } .exito { color: #38761d; }
.datos-alumno { display: none; margin-top: 25px; }
.tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tarjeta { background: white; border-radius: 14px; padding: 18px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,.08); }
.tarjeta .titulo { font-size: 13px; color: #777; }
.tarjeta .valor { font-size: 23px; font-weight: bold; margin-top: 8px; color: #6b3fa0; }
.tabla-contenedor { background: white; border-radius: 14px; padding: 15px; overflow-x: auto; box-shadow: 0 3px 12px rgba(0,0,0,.10); }
.tabla-contenedor h3 { color: #6b3fa0; }
table { border-collapse: collapse; width: 100%; min-width: 1400px; }
th { background: #6b3fa0; color: white; padding: 9px; border: 1px solid #ddd; white-space: nowrap; }
td { padding: 8px; border: 1px solid #ddd; text-align: center; white-space: nowrap; }
.verde { background: #b6d7a8; font-weight: bold; }
.amarillo { background: #ffe599; font-weight: bold; }
.rojo { background: #ea9999; font-weight: bold; }
.gris { background: #eeeeee; }
footer { text-align: center; padding: 30px 15px; color: #777; font-size: 13px; }
@media (max-width: 600px) {
header h1 { font-size: 22px; }
header h2 { font-size: 13px; }
.buscador { padding: 20px 15px; }
.buscador h3 { font-size: 21px; }
.tarjetas { grid-template-columns: 1fr 1fr; }
}
</style>
</head>

<h2>Escuela Secundaria Estatal "Gral. Francisco Villa" No. 3017</h2>
<h2>Sistema Integral de Evaluación y Economía Escolar (SIEE)</h2>
</header>
<div class="contenedor">
<div class="buscador">

<br>
<button type="button" id="botonConsultar">CONSULTAR</button>
<div id="mensaje"></div>
</div>
<div id="datosAlumno" class="datos-alumno">
<div class="tarjetas">
<div class="tarjeta"><div class="titulo">ALUMNO</div><div class="valor" id="nombreAlumno">---</div></div>
<div class="tarjeta"><div class="titulo">PROMEDIO FINAL</div><div class="valor" id="promedioFinal">---</div></div>

</div>
<div class="tabla-contenedor">
<h3>📊 Desempeño académico</h3>
<table><thead><tr id="encabezados"></tr></thead><tbody><tr id="filaAlumno"></tr></tbody></table>
</div>
</div>

<footer>Profesora Myrna Judith Limas Gómez</footer>

/*
  Cada ID apunta a un archivo público INDEPENDIENTE.
  Por privacidad, el portal no consulta una hoja con todos
  los alumnos. Al localizar un ID, muestra únicamente
  la ficha pública correspondiente.
*/

function mostrarMensaje(texto, clase) {
  const mensaje = document.getElementById("mensaje");
  mensaje.textContent = texto;
  mensaje.className = clase || "";
}

function buscarAlumno() {
  const campo = document.getElementById("idAlumno");
  const id = campo.value.trim().toUpperCase();
  const datos = document.getElementById("datosAlumno");

  datos.style.display = "none";

  if (!id) {
    mostrarMensaje("Escribe el ID del alumno.", "error");
    return;
  }

  if (!/^A-\d{3}$/.test(id)) {
    mostrarMensaje("Escribe el ID con este formato: A-001.", "error");
    return;
  }

  const url = FICHAS[id];

  if (!url) {
    mostrarMensaje("No se encontró el ID " + id + ".", "error");
    return;
  }

  /*
    La ficha publicada de Google Sheets es la fuente individual.
    Se abre en una nueva pestaña para que el usuario vea únicamente
    la información del alumno correspondiente.
  */
  window.open(url, "_blank", "noopener,noreferrer");

  mostrarMensaje("Ficha del alumno " + id + " abierta correctamente.", "exito");
}

document.getElementById("botonConsultar").addEventListener("click", buscarAlumno);

document.getElementById("idAlumno").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    buscarAlumno();
  }
});
