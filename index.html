<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIEE 3017</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f1f7;
    color: #333;
  }

  header {
    background: #6b3fa0;
    color: white;
    text-align: center;
    padding: 22px 15px;
  }

  header h1 {
    margin: 0;
    font-size: 24px;
  }

  header h2 {
    margin: 7px 0 0;
    font-size: 15px;
    font-weight: normal;
  }

  .contenedor {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 15px;
  }

  .buscador {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,.10);
    text-align: center;
  }

  .buscador h3 {
    margin-top: 0;
    color: #6b3fa0;
  }

  input {
    width: 100%;
    max-width: 400px;
    padding: 13px;
    border: 2px solid #d4c5e5;
    border-radius: 10px;
    font-size: 16px;
    text-align: center;
  }

  button {
    margin-top: 12px;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    background: #6b3fa0;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background: #573283;
  }

  #mensaje {
    margin-top: 15px;
    font-weight: bold;
  }

  .datos-alumno {
    display: none;
    margin-top: 20px;
  }

  .tarjetas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .tarjeta {
    background: white;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,.08);
  }

  .tarjeta .titulo {
    font-size: 13px;
    color: #777;
  }

  .tarjeta .valor {
    font-size: 25px;
    font-weight: bold;
    margin-top: 7px;
    color: #6b3fa0;
  }

  .estado {
    font-size: 18px !important;
  }

  .tabla-contenedor {
    background: white;
    border-radius: 14px;
    padding: 15px;
    overflow-x: auto;
    box-shadow: 0 3px 12px rgba(0,0,0,.10);
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1400px;
  }

  th {
    background: #6b3fa0;
    color: white;
    padding: 9px;
    border: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 2;
    white-space: nowrap;
  }

  td {
    padding: 8px;
    border: 1px solid #ddd;
    text-align: center;
    white-space: nowrap;
  }

  td.nombre {
    text-align: left;
    font-weight: bold;
    position: sticky;
    left: 0;
    background: white;
    z-index: 1;
  }

  .verde {
    background: #b6d7a8;
    font-weight: bold;
  }

  .amarillo {
    background: #ffe599;
    font-weight: bold;
  }

  .rojo {
    background: #ea9999;
    font-weight: bold;
  }

  .gris {
    background: #eeeeee;
  }

  footer {
    text-align: center;
    padding: 25px 15px;
    color: #777;
    font-size: 13px;
  }

  .cargando {
    color: #6b3fa0;
  }

  .error {
    color: #c00000;
  }

  @media (max-width: 600px) {

    header h1 {
      font-size: 20px;
    }

    header h2 {
      font-size: 13px;
    }

    .tarjetas {
      grid-template-columns: 1fr 1fr;
    }

    .tarjeta .valor {
      font-size: 20px;
    }
  }
</style>
</head>

<body>

<header>
  <h1>🐺 SIEE 3017</h1>
  <h2>
    Escuela Secundaria Estatal "Gral. Francisco Villa" No. 3017
  </h2>
  <h2>
    Sistema Integral de Evaluación y Economía Escolar (SIEE)
  </h2>
</header>


<div class="contenedor">

  <div class="buscador">

    <h3>Consulta de alumno</h3>

    <p>

    </p>

    <input
      type="text"
      id="idAlumno"
      placeholder="Ejemplo: ALONSO-001"
      autocomplete="off"
    >

    <br>

    <button onclick="buscarAlumno()">
      CONSULTAR
    </button>

    <div id="mensaje"></div>

  </div>


  <div id="datosAlumno" class="datos-alumno">

    <div class="tarjetas">

      <div class="tarjeta">
        <div class="titulo">ALUMNO</div>
        <div class="valor" id="nombreAlumno">---</div>
      </div>

      <div class="tarjeta">
        <div class="titulo">PROMEDIO FINAL</div>
        <div class="valor" id="promedioFinal">---</div>
      </div>

      <div class="tarjeta">
        <div class="titulo">MATEPESOS</div>
        <div class="valor" id="matepesos">---</div>
      </div>

      <div class="tarjeta">
        <div class="titulo">ESTADO</div>
        <div class="valor estado" id="estadoAlumno">---</div>
      </div>

    </div>


    <div class="tabla-contenedor">

      <h3>📊 Desempeño académico</h3>

      <table id="tablaAlumno">

        <thead>
          <tr id="encabezados"></tr>
        </thead>

        <tbody>
          <tr id="filaAlumno"></tr>
        </tbody>

      </table>

    </div>

  </div>

</div>


<footer>
  Profesora Myrna Judith Limas Gómez
</footer>
