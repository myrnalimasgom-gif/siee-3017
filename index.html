<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SIEE 3017</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f4f6f9;
      font-family: Arial, sans-serif;
    }

    #cargando {
      position: fixed;
      inset: 0;
      background: #f4f6f9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
    }

    .logo {
      font-size: 60px;
      margin-bottom: 10px;
    }

    h1 {
      color: #0b5394;
      margin: 5px 0;
      font-size: 28px;
    }

    h2 {
      color: #444;
      font-size: 18px;
      font-weight: normal;
      margin: 8px 20px 25px;
    }

    .loader {
      width: 42px;
      height: 42px;
      border: 5px solid #ddd;
      border-top: 5px solid #0b5394;
      border-radius: 50%;
      animation: girar 1s linear infinite;
    }

    @keyframes girar {
      100% {
        transform: rotate(360deg);
      }
    }

    #portal {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
    }

    #error {
      display: none;
      position: fixed;
      inset: 0;
      background: #f4f6f9;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
    }

    .errorBox {
      background: white;
      max-width: 500px;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,.15);
    }

    .boton {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 24px;
      background: #0b5394;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div id="cargando">
    <div class="logo">🐺</div>

    <h1>SIEE 3017</h1>

    <h2>
      Sistema Integral de Evaluación<br>
      y Economía Escolar
    </h2>

    <div class="loader"></div>

    <p>Abriendo el portal del alumno...</p>
  </div>

  <iframe
    id="portal"
    allow="fullscreen">
  </iframe>

  <div id="error">
    <div class="errorBox">
      <div class="logo">🐺</div>

      <h1>SIEE 3017</h1>

      <p>
        No se pudo abrir el portal automáticamente.
      </p>

      <a id="botonEntrada"
         class="boton"
         href="#">
        ENTRAR AL PORTAL
      </a>
    </div>
  </div>

  <script>

    const URL_SIEE =
      "https://script.google.com/macros/s/AKfycbxrdzzEQ4qmJcj_VU0PxFOh3F3BeErzVpU30Cxl7OwH8bjfxBLA89lLwuVRlS5HapG7JA/exec";

    const parametros = new URLSearchParams(window.location.search);

    const id = parametros.get("id");

    if (!id) {

      document.getElementById("cargando").style.display = "none";
      document.getElementById("error").style.display = "flex";

      document.querySelector("#error p").textContent =
        "No se recibió el identificador del alumno.";

    } else {

      const urlAlumno =
        URL_SIEE + "?id=" + encodeURIComponent(id);

      document.getElementById("portal").src = urlAlumno;

      document.getElementById("botonEntrada").href = urlAlumno;

      setTimeout(function() {

        document.getElementById("cargando").style.display = "none";
        document.getElementById("portal").style.display = "block";

      }, 2500);
    }

  </script>

</body>
</html>
